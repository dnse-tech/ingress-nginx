name: Sync Rancher Upstream

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific tag to sync (e.g., v1.14.1-hardened2)"
        required: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: rancher/ingress-nginx

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new upstream releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine tag: use provided input or fetch latest from upstream
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view -R ${{ env.UPSTREAM_REPO }} --json tagName -q .tagName 2>/dev/null || echo "")
          fi

          if [ -z "$TAG" ]; then
            echo "No releases found upstream"
            echo "has_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "upstream_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $TAG"

          # Check if tag already exists locally
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists"
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release detected: $TAG"
            echo "new_release=true" >> $GITHUB_OUTPUT
          fi
          echo "has_release=true" >> $GITHUB_OUTPUT

      - name: Sync upstream tag and create release
        if: steps.check.outputs.has_release == 'true' && steps.check.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check.outputs.upstream_tag }}"

          # Add upstream remote and fetch tags
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream --tags

          # Create local tag pointing to upstream commit
          git tag -f "$TAG" "upstream/$TAG^{}" 2>/dev/null || git tag -f "$TAG" $(git rev-list -n1 "upstream/$TAG")
          git push origin "$TAG" --force

          # Create release with sync information
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Synced from ${{ env.UPSTREAM_REPO }}

          Upstream release: https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/$TAG

          This release triggers s390x multi-arch build."

      - name: Summary
        if: always()
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Upstream: ${{ env.UPSTREAM_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ steps.check.outputs.upstream_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- New release: ${{ steps.check.outputs.new_release }}" >> $GITHUB_STEP_SUMMARY
